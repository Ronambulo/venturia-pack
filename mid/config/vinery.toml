[Blocks]
	#Total fermentation time in ticks
	# Default: 6000
	# Range: > 1
	totalFermentationTime = 6000
	#Maximum fluid level in the Fermentation Barrel
	# Default: 100
	# Range: 10 ~ 1000
	maxFluidLevel = 100
	#How much Fluid a Grapejuice Bottle fills
	# Default: 25
	# Range: 1 ~ 1000
	maxFluidPerJuice = 25
	#Apple Press mashing time in ticks
	# Default: 600
	# Range: 1 ~ 1000
	applePressMaxMashingProgress = 600
	#Apple Press fermenting time in ticks
	# Default: 800
	# Range: 1 ~ 1000
	applePressMaxFermentingProgress = 800
	#Chance for cherries to grow
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	cherryGrowthChance = 0.4
	#Chance for apples to grow
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	appleGrowthChance = 0.4
	#Chance for grapes to grow
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	grapeGrowthChance = 0.5
	#Multiplies the growth chance of grape bushes, grapevine stems and lattices. 0 = grapes never grow.
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	grapeGrowthMultiplier = 1.0
	#Whether Red/White Grapevine stems grow a canopy of leaves around them after some time
	grapevineLeavesEnabled = true
	#Jumps needed to stomp a full Grapevine Pot
	# Default: 12
	# Range: 1 ~ 100
	grapevinePotStomps = 12
	#How much faster heavy armor (iron or better) stomps in the Grapevine Pot, in percent
	# Default: 10
	# Range: 0 ~ 100
	grapevinePotHeavyArmorBonus = 10
	#Whether juice splashes out of the Grapevine Pot when stomping
	grapevinePotSplashParticles = true

	[Items.Wine]
		#Maximum effect levels gained through aging, added to the wine's base amplifier.
		# Default: 5
		# Range: 0 ~ 10
		maxLevel = 5
		#Effect duration in ticks added per wine year (20 ticks = 1 second).
		# Default: 200
		# Range: 0 ~ 10000
		durationPerYear = 200
		#Minecraft days that make one wine year (one day = 24000 ticks = 20 minutes).
		# Default: 24
		# Range: 1 ~ 100
		daysPerYear = 24
		#Wine years needed for each additional effect level.
		# Default: 6
		# Range: 1 ~ 100
		yearsPerEffectLevel = 6
		#Maximum effect duration in ticks reachable through aging (20 ticks = 1 second).
		# Default: 15000
		# Range: 1 ~ 100000
		maxDuration = 15000
		#Whether wine gets stronger with age. If false, every wine uses the effect, amplifier and duration from 'effects'.
		agingEnabled = true
		#If true, wine only ages while it sits in a storage block (wine racks, wine box, shelves, placed bottles).
		#If false, wine ages from the moment it is brewed, wherever it is.
		ageOnlyInStorage = false
		#How much faster wine ages in storage without sky light (underground or fully roofed). 1.0 = no bonus.
		# Default: 1.5
		# Range: 1.0 ~ 5.0
		cellarAgingMultiplier = 1.5
		#Effect of each wine. Format: wine|effect|amplifier|durationTicks
		#amplifier 0 = level I. durationTicks is the duration of a fresh bottle, aging adds to it.
		effects = ["vinery:apple_cider|minecraft:strength|0|1800", "vinery:apple_wine|minecraft:resistance|0|1800", "vinery:mead|minecraft:haste|0|1800", "vinery:glowing_wine|minecraft:glowing|0|1800", "vinery:solaris_wine|minecraft:health_boost|0|1800", "vinery:kelp_cider|vinery:water_walker|0|1800", "vinery:eiswein|vinery:frosty_armor|0|1800", "vinery:aegis_wine|vinery:armor_effect|0|1800", "vinery:villagers_fright|minecraft:bad_omen|0|1800", "vinery:clark_wine|vinery:double_jump|0|1800", "vinery:jellie_wine|vinery:jellie|0|1800", "vinery:noir_wine|minecraft:jump_boost|0|1800", "vinery:red_wine|minecraft:slow_falling|0|1800", "vinery:strad_wine|minecraft:night_vision|0|1800", "vinery:cherry_wine|minecraft:invisibility|0|1800", "vinery:cristel_wine|minecraft:water_breathing|0|1800", "vinery:lilitu_wine|vinery:party_effect|0|1800", "vinery:jo_special_mixture|vinery:climbing_effect|0|1800", "vinery:bolvar_wine|vinery:lava_walker|0|1800", "vinery:magnetic_wine|vinery:magnet|0|1800", "vinery:stal_wine|vinery:health_effect|0|1800", "vinery:chenet_wine|vinery:climbing_effect|0|1800", "vinery:bottle_mojang_noir|vinery:experience_effect|0|1800", "vinery:chorus_wine|vinery:teleport|0|10", "vinery:creepers_crush|vinery:creeper_effect|0|100", "vinery:mellohi_wine|minecraft:instant_health|0|1"]

	[Items.Banner]
		#Set to false to disable the banner's effect.
		giveEffect = true
		#Set to false to hide the banner's tooltip. If giveEffect is false, showTooltip is automatically false.
		showTooltip = true

	[Items.WanderingTrader]
		#Chance for the custom trader to spawn. Range: 0.0 to 1.0
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		spawnChance = 0.5
		#If true, the trader will spawn with mules.
		spawnWithMules = true
		#Spawn delay for the trader in ticks.
		# Default: 48000
		# Range: > 1
		spawnDelay = 48000

