[effects]
	#Your hunger never drops below this while Well Served is active
	# Default: 8
	# Range: 0 ~ 20
	wellServedFoodFloor = 8
	#How many harvests Refreshed covers
	# Default: 10
	# Range: 1 ~ 64
	refreshedMaxCharges = 10
	#Wearing the Gold Ring gives Luck
	ringLuckEnabled = true
	#0 is Luck I, 1 is Luck II
	# Default: 1
	# Range: 0 ~ 4
	ringLuckAmplifier = 1
	#Players near a placed Completionist Banner get its effect
	bannerGiveEffect = true
	#Radius of the Completionist Banner effect
	# Default: 8
	# Range: 1 ~ 32
	bannerRadius = 8
	#Level of the Completionist Banner effect, 0 is level I
	# Default: 0
	# Range: 0 ~ 4
	bannerAmplifier = 0

[misc]
	#Food eaten from a Table Set fills you up this many times more
	# Default: 1.3
	# Range: 1.0 ~ 3.0
	tableSetFoodBonus = 1.3
	#Food bonus with a full Suit or Evening Dress
	# Default: 1.5
	# Range: 1.0 ~ 3.0
	elegantFoodBonus = 1.5
	#Extra Well Served for every table setting, 1200 ticks are one minute
	# Default: 1200
	# Range: 0 ~ 12000
	wellServedTicksPerCourse = 1200
	#Longest Well Served you can get from a Table Set
	# Default: 12000
	# Range: 0 ~ 72000
	maxWellServedTicks = 12000
	#Extra Well Served and Refreshed for a full menu
	# Default: 6000
	# Range: 0 ~ 72000
	menuBonusTicks = 6000
	#Longest Well Served you can get from a full menu
	# Default: 18000
	# Range: 0 ~ 72000
	maxMenuWellServedTicks = 18000
	#How long you may wait between two courses
	# Default: 6000
	# Range: 200 ~ 72000
	menuMaxTicksBetweenCourses = 6000
	#Villagers may eat dishes from Table Sets in the evening
	dinnerGuests = true
	#Chance every 10 seconds that a villager comes to the table
	# Default: 0.3
	# Range: 0.0 ~ 1.0
	dinnerGuestChance = 0.3
	#How far away villagers notice the dish
	# Default: 16
	# Range: 4 ~ 64
	dinnerGuestRange = 16
	#Discount on all trades after the dinner
	# Default: 10
	# Range: 0 ~ 100
	dinnerDiscountPercent = 10
	#24000 ticks are one Minecraft day
	# Default: 24000
	# Range: 1200 ~ 240000
	dinnerDiscountTicks = 24000
	#Chance of an extra portion from Cooking Pan and Cooking Pot with the full set
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	chefSetExtraPortionChance = 0.25
	#A lit candle or lamp next to a Table Set counts as a table setting
	tableLightsEnabled = true
	#How far away a light may stand from the Table Set
	# Default: 1
	# Range: 1 ~ 4
	tableLightRadius = 1
	#Starter, main course and dessert in a row give a bonus
	dinnerMenuEnabled = true
	#Drinks can be poured into the glasses of a Table Set
	tableDrinksEnabled = true
	#Time of day from which villagers come to dinner, 9000 is after work
	# Default: 9000
	# Range: 0 ~ 24000
	dinnerStart = 9000
	#Time of day until villagers come to dinner, 12000 is bedtime
	# Default: 12000
	# Range: 0 ~ 24000
	dinnerEnd = 12000
	#How often a Table Set looks for a guest, 200 ticks are 10 seconds
	# Default: 200
	# Range: 20 ~ 6000
	dinnerGuestInterval = 200
	#Nitwits eat the dish but give no discount
	nitwitsEat = true
	#Only the player who served the dish gets the discount
	discountOnlyHost = false
	#Turn the Chef's Outfit set bonus on or off
	chefSetBonusEnabled = true
	#Turn the Suit and Evening Dress set bonus on or off
	elegantSetBonusEnabled = true
	#Chance that a zombie spawns with a Cooking Hat
	# Default: 0.03
	# Range: 0.0 ~ 1.0
	zombieCookingHatChance = 0.03
	#Play a soft sound while dabbing with a Napkin
	napkinSound = true
	#Freshly served dishes on a Table Set steam for a while
	dishSteam = true
	#How long freshly served dishes steam, in ticks
	# Default: 2400
	# Range: 200 ~ 12000
	dishSteamTicks = 2400
	#How many lines fit on a Table Sign
	# Default: 8
	# Range: 1 ~ 12
	tableSignMaxLines = 8
	#Show the info tooltip when looking at a Table Set
	showTableSetInfo = true
	#Show the set pieces and bonus on clothing
	showSetBonusTooltips = true

